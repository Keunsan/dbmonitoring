# 로컬 통합 smoke — VM/K8s 배포는 보류 (docs/DEPLOYMENT_PROMPT.md)
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      APP_PORT: "8000"
      COLLECTOR_SCHEDULER_DISABLED: "false"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  # Collector: DEC — API 프로세스 내 스케줄러 기본. 별도 worker는 주석 해제 시 사용.
